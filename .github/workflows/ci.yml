name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skilledguard
          POSTGRES_PASSWORD: skilledguard
          POSTGRES_DB: skilledguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skilledguard"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://skilledguard:skilledguard@localhost:5432/skilledguard_test
      JWT_SECRET: secreto-de-pruebas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Pruebas
        run: pytest -q
