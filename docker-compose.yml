services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skilledguard
      POSTGRES_PASSWORD: skilledguard
      POSTGRES_DB: skilledguard
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      # La API arranca solo cuando Postgres acepta conexiones, no cuando el
      # contenedor existe: sin esto las migraciones fallan por carrera de arranque.
      test: ["CMD-SHELL", "pg_isready -U skilledguard"]
      interval: 5s
      retries: 10

  api:
    build: .
    # Sin `command`: se usa el entrypoint de la imagen, el mismo que corre en la
    # plataforma de despliegue. Duplicar aquí el comando de arranque es cómo se
    # llega a que local y producción arranquen distinto sin que nadie lo note.
    environment:
      DATABASE_URL: postgresql+psycopg://skilledguard:skilledguard@db:5432/skilledguard
      # Sin valor por defecto a propósito: un secreto escrito aquí queda en el
      # repositorio, y cualquiera que lo lea puede firmar tokens de cualquier
      # usuario. Si falta, el arranque falla — que es lo correcto.
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET; copia .env.example a .env}
      # Opcionales: si faltan, el entrypoint simplemente no siembra el admin.
      ADMIN_DOCUMENTO: ${ADMIN_DOCUMENTO:-}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:-}
    # Solo en loopback. El entrypoint arranca uvicorn confiando en las cabeceras
    # X-Forwarded-* de cualquier origen, lo que es correcto detrás del proxy de
    # la plataforma pero no si el puerto queda abierto a la red: ahí cualquiera
    # podría falsificar su IP de origen en la bitácora de accesos.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/salud').status==200 else 1)\""]
      interval: 15s
      start_period: 30s
      retries: 3

volumes:
  datos_postgres:
